<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layar Nursery - PT Arutmin Indonesia Tambang Senakin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap">
<style>
:root{
  --tint:20,70,45; --bg:#F2F5F1; --panel:#FFFFFF; --panel2:#FFFFFF; --line:rgba(20,70,45,.10);
  --cardbg:#FFFFFF; --shadow:0 1px 2px rgba(20,60,40,.05),0 10px 28px rgba(20,60,40,.07);
  --tag:#FFFFFF; --amberText:#8E5208; --amberStrong:#B36A0E; --body:#2E4639; --ph1:#E4F1E7; --ph2:#F6FAF6;
  --stagebg:radial-gradient(1200px 700px at 80% -15%,rgba(140,198,63,.16),transparent 60%),radial-gradient(900px 600px at -5% 110%,rgba(58,120,201,.07),transparent 60%),#F2F5F1;
  --ink:#15291F; --muted:#4F6A5B; --dim:#5E7868;
  --green:#1E9259; --lime:#3F7E14; --amber:#E8962E; --blue:#3A78C9; --coral:#E06A4A;
}
body.gelap{
  --tint:255,255,255; --bg:#07130E; --panel:#0F241B; --panel2:#132C21; --line:rgba(220,255,235,.09);
  --ink:#EDF5EF; --muted:#A9C2B3; --dim:#7F998A;
  --green:#4FD08A; --lime:#B5E86E; --amber:#F4B860; --blue:#7FB2F0; --coral:#F08A6C;
  --cardbg:linear-gradient(180deg,#132C21,#0F241B); --shadow:none;
  --tag:rgba(4,16,11,.8); --amberText:#F4B860; --amberStrong:#F4B860; --body:#D4E4DA; --ph1:#1D4A33; --ph2:#0F241B;
  --stagebg:radial-gradient(1200px 700px at 78% -10%,rgba(79,208,138,.10),transparent 60%),radial-gradient(900px 600px at -5% 110%,rgba(127,178,240,.06),transparent 60%),#07130E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
body.sepi{cursor:none}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
  background:var(--stagebg);transition:background .4s}

/* header */
#top{position:absolute;left:40px;right:40px;top:0;height:108px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:20px}
.logo{width:62px;height:62px;border-radius:18px;background:linear-gradient(145deg,#1E5A3D,#0F3524);border:1px solid rgba(181,232,110,.25);display:flex;align-items:center;justify-content:center}
.org{font-size:17px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--lime)}
.ttl{font-size:38px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.ttl span{color:var(--muted);font-weight:500}
.kanan{display:flex;align-items:center;gap:32px}
#chip{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:rgba(var(--tint),.03);border-radius:999px;padding:10px 20px;font-size:19px;font-weight:600;color:var(--muted);max-width:520px}
#chip i{width:12px;height:12px;border-radius:50%;flex:none;background:var(--green);box-shadow:0 0 0 0 rgba(79,208,138,.6);animation:nadi 2s infinite}
#chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chip.offline i{background:var(--amber);animation:none}
#chip.demo i{background:var(--coral);animation:none}
@keyframes nadi{0%{box-shadow:0 0 0 0 rgba(79,208,138,.55)}70%{box-shadow:0 0 0 12px rgba(79,208,138,0)}100%{box-shadow:0 0 0 0 rgba(79,208,138,0)}}
.jam{text-align:right}
#jam{font-size:50px;font-weight:800;line-height:1}
#tgl{font-size:19px;color:var(--muted);margin-top:4px}

/* tabs / progress */
#tabs{position:absolute;left:40px;top:124px;width:1404px;display:flex;gap:10px}
#tabs button{flex:1;background:none;border:0;color:var(--dim);font:600 17px 'Plus Jakarta Sans',sans-serif;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:9px;padding:4px 0;min-height:44px}
#tabs button b{display:block;height:5px;border-radius:3px;background:rgba(var(--tint),.10);overflow:hidden}
#tabs button b em{display:block;height:100%;width:0;background:var(--green);border-radius:3px}
#tabs button.done b em{width:100%;background:rgba(79,208,138,.45)}
#tabs button.on{color:var(--ink)}
#tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:4px}

/* main + side */
#scenes{position:absolute;left:40px;top:196px;width:1404px;height:802px}
#side{position:absolute;left:1468px;top:124px;width:412px;height:874px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--cardbg);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.lab{font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.big{padding:26px 28px}
.big .v{font-size:96px;font-weight:800;line-height:1;margin:12px 0 4px}
.big .u{font-size:20px;color:var(--muted)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-top:20px;gap:3px}
.stack i{display:block;height:100%}
.slg{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:16px;color:var(--muted)}
.slg span{display:flex;align-items:center;gap:8px}
.slg i{width:12px;height:12px;border-radius:3px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini{padding:20px 22px}
.mini .v{font-size:44px;font-weight:800;line-height:1.1;margin-top:8px}
.mini .s{font-size:16px;color:var(--dim)}
.bln{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.bln .row{display:flex;justify-content:space-between;align-items:baseline}
.bln .row b{font-size:34px;font-weight:800}
.bln .row span{font-size:19px;color:var(--muted)}
.bln .kecil{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bln .kecil div{background:rgba(var(--tint),.04);border-radius:12px;padding:10px 12px}
.bln .kecil b{display:block;font-size:24px;font-weight:800}
.bln .kecil span{font-size:15px;color:var(--muted)}
.ctl{margin-top:auto;padding:14px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ctl button{height:72px;border-radius:16px;border:1px solid var(--line);background:rgba(var(--tint),.05);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 13px 'Plus Jakarta Sans',sans-serif;transition:background .2s,transform .1s}
.ctl button svg{width:28px;height:28px}
.ctl button:hover,.ctl button:focus-visible{background:var(--green);color:#fff;border-color:var(--green);outline:none}
.ctl button:active{transform:scale(.95)}
.ctl button.aktif{background:var(--amber);color:#2B1708;border-color:var(--amber)}

/* ticker */
#ticker{position:absolute;left:0;right:0;bottom:0;height:66px;background:#0F3B27;border-top:1px solid var(--line);display:flex;align-items:center;overflow:hidden}
#tkLab{flex:none;height:100%;display:flex;align-items:center;padding:0 28px 0 40px;background:#B9E57C;color:#0F3B27;font-size:19px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%);padding-right:48px}
#tkWrap{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
#tkRun{display:inline-block;padding-left:100%;font-size:23px;font-weight:500;color:#fff;animation:jalan linear infinite}
#tkRun em{font-style:normal;color:#B9E57C;font-weight:700;margin:0 28px}
@keyframes jalan{from{transform:translateX(0)}to{transform:translateX(-100%)}}
#jedaChip{display:none;flex:none;margin:0 24px;background:var(--amber);color:#2B1708;border-radius:999px;padding:6px 16px;font-size:17px;font-weight:800}
body.jeda #jedaChip{display:block}

/* animasi scene */
.scene{width:100%;height:100%;animation:masuk .55s ease-out both}
@keyframes masuk{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes naik{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes tumbuhX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tumbuhY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes sapu{from{stroke-dasharray:0 var(--c)}}
@keyframes zoom{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.rise{animation:naik .6s ease-out both;animation-delay:calc(var(--i,0) * 80ms)}
.pnl{padding:30px 36px}
.h{display:flex;justify-content:space-between;align-items:center;gap:20px}
.h .lab{font-size:18px}
.lgd{display:flex;gap:24px;font-size:18px;font-weight:600;color:var(--muted)}
.lgd span{display:flex;align-items:center;gap:9px}
.lgd i{width:16px;height:16px;border-radius:4px}

/* komposisi */
.komp{display:grid;grid-template-columns:600px 1fr;gap:24px;height:100%}
.donut{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.seg{animation:sapu 1.2s ease-out both}
.kats{display:flex;flex-direction:column;gap:16px}
.kat{padding:24px 28px;display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:center}
.kat .n{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:700}
.kat .n i{width:18px;height:18px;border-radius:5px}
.kat .v{font-size:40px;font-weight:800;text-align:right}
.kat .j{font-size:19px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kat .p{font-size:20px;color:var(--muted);text-align:right}
.kat .tr{grid-column:1/-1;height:8px;border-radius:4px;background:rgba(var(--tint),.07);overflow:hidden;margin-top:6px}
.kat .tr b{display:block;height:100%;border-radius:4px;transform-origin:left;animation:tumbuhX 1s ease-out both}

/* jenis */
.jenis{height:100%;display:flex;flex-direction:column;gap:18px}
.jrows{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.jr{display:grid;grid-template-columns:44px 300px 1fr 150px;gap:20px;align-items:center}
.rk{font-size:22px;font-weight:700;color:var(--dim)}
.jn{font-size:28px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:30px;border-radius:8px;background:rgba(var(--tint),.05);overflow:hidden}
.bar{height:100%;border-radius:8px;transform-origin:left;animation:tumbuhX .9s ease-out both;animation-delay:calc(var(--i,0) * 60ms)}
.jv{font-size:32px;font-weight:800;text-align:right}
.cat{font-size:17px;color:var(--dim)}

/* tren */
.tren{height:100%;display:flex;flex-direction:column;gap:18px}
.tsvg{flex:1;min-height:0;padding-top:10px}
.tsvg svg{width:100%;height:100%;display:block}
.bx{transform-box:fill-box;transform-origin:center bottom;animation:tumbuhY .9s ease-out both}
.st3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;flex:none}
.st{padding:20px 26px}
.st .v{font-size:42px;font-weight:800;margin-top:6px}
.st .v small{font-size:20px;font-weight:500;color:var(--muted)}

/* kamus */
.spot{display:grid;grid-template-columns:640px 1fr;gap:24px;height:100%}
.foto{position:relative;overflow:hidden}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:zoom 20s ease-out both}
.fb{position:absolute;inset:0;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,var(--ph1),var(--ph2) 70%)}
.foto .tag{position:absolute;left:24px;top:24px;background:var(--tag);box-shadow:0 4px 14px rgba(20,60,40,.12);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:18px;font-weight:700}
.sptx{display:flex;flex-direction:column;justify-content:center;gap:18px}
.sptx .nm{font-size:92px;font-weight:800;line-height:1;letter-spacing:-.02em}
.sptx .il{font-size:34px;font-style:italic;font-weight:500;color:var(--lime)}
.fk2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.fk{background:rgba(var(--tint),.04);border:1px solid var(--line);border-radius:16px;padding:16px 22px}
.fk span{display:block;font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fk b{font-size:36px;font-weight:800}
.mf{font-size:26px;line-height:1.5;color:var(--body);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.hit{font-size:18px;color:var(--dim)}

/* kegiatan */
.akt{display:grid;gap:24px;height:100%}
.list{display:flex;flex-direction:column;margin-top:14px}
.krow{display:grid;grid-template-columns:120px 1fr 200px;gap:22px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.krow:last-child{border-bottom:0}
.kt{text-align:center;border-radius:14px;background:rgba(79,208,138,.10);border:1px solid rgba(79,208,138,.25);padding:8px 6px}
.kt b{display:block;font-size:34px;font-weight:800;line-height:1}
.kt span{font-size:16px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.08em}
.kn{font-size:28px;font-weight:700}
.ks{font-size:20px;color:var(--muted);margin-top:4px}
.kj{font-size:34px;font-weight:800;text-align:right}
.kj small{font-size:18px;font-weight:500;color:var(--muted)}
.pgi{border-left:0;background:rgba(244,184,96,.08);border:1px solid rgba(244,184,96,.25);border-radius:16px;padding:18px 22px;margin-top:14px}
.pgi small{display:block;font-size:15px;font-weight:800;letter-spacing:.1em;color:var(--amberText);text-transform:uppercase;margin-bottom:6px}
.pgi p{font-size:24px;line-height:1.4}
.kosong{font-size:22px;color:var(--dim);margin-top:20px}

/* galeri */
.gal{display:grid;gap:18px;height:100%}
.gt{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);background:radial-gradient(circle at 50% 35%,var(--ph1),var(--ph2) 70%)}
.gt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gt.besar{grid-row:span 2}
.gph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.gcap{color:#fff;position:absolute;left:0;right:0;bottom:0;padding:70px 26px 22px;background:linear-gradient(to top,rgba(4,16,11,.95),rgba(4,16,11,0))}
.gcap b{display:block;font-size:28px;line-height:1.2}
.gt.besar .gcap b{font-size:40px}
.gcap span{font-size:18px;color:#DCE8E0}

/* agenda */
.agd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:20px}
.ag{padding:22px 26px;background:rgba(var(--tint),.03);border:1px solid var(--line);border-radius:18px}
.ag b{font-size:30px;display:block}
.ag p{font-size:22px;color:var(--muted);margin-top:4px}
.ag .w{margin-top:10px;font-size:20px;font-weight:700;color:var(--green)}

/* siklus */
.sik{height:100%;display:grid;grid-template-rows:auto 1fr;gap:24px}
.lgk{position:relative;margin-top:30px}
.garis{position:absolute;top:52px;left:8%;right:8%;height:3px;background:linear-gradient(90deg,var(--green),var(--amber));transform-origin:left;animation:tumbuhX 1.4s ease-out both;opacity:.6}
.lgr{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.ls{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.lb{width:106px;height:106px;border-radius:50%;background:var(--panel);border:3px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:var(--green)}
.lb.t{border-color:var(--amber);color:var(--amberStrong)}
.ls b{font-size:30px}
.ls span{font-size:20px;color:var(--muted);line-height:1.35}
.k3g{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
.k3i{display:flex;gap:18px;align-items:center;font-size:27px;line-height:1.3;background:rgba(127,178,240,.06);border:1px solid rgba(127,178,240,.18);border-radius:16px;padding:18px 22px}
.k3p{margin-top:18px;font-size:22px;color:var(--blue);font-weight:600}

#toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--green);color:#fff;font-weight:700;font-size:22px;padding:10px 28px;border-radius:999px;transition:opacity .5s;opacity:0;pointer-events:none;white-space:nowrap;z-index:5}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* === grup aplikasi pada tab === */
#tabs{display:flex;gap:30px}
.grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.grp .nm{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.grp .nm i{width:10px;height:10px;border-radius:50%;flex:none}
.grp.on .nm{color:var(--ink)}
.segs{display:flex;gap:6px}
.segs button{flex:1;min-width:0;height:30px;padding:0;background:none;border:0;cursor:pointer;display:flex;align-items:center}
.segs button b{display:block;width:100%;height:6px;border-radius:3px;background:rgba(var(--tint),.10);overflow:hidden}
.segs button b em{display:block;height:100%;width:0;border-radius:3px;background:var(--app)}
.segs button.done b em{width:100%;opacity:.45}
.segs button:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}
#appJudul{color:var(--ink);font-weight:800}
#stage{--app:#1E9259}
/* === K3 & lingkungan === */
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;height:100%}
.ring{display:flex;align-items:center;gap:30px;margin-top:18px}
.ring .t b{display:block;font-size:56px;font-weight:800;line-height:1}
.ring .t span{font-size:20px;color:var(--muted)}
.izl{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.iz{display:grid;grid-template-columns:1fr auto;gap:4px 20px;padding:18px 22px;border-radius:16px;background:rgba(var(--tint),.04);border:1px solid var(--line)}
.iz b{font-size:27px}
.iz .m{font-size:20px;color:var(--muted)}
.iz .s{grid-row:span 2;align-self:center;text-align:right;font-size:18px;color:var(--muted)}
.iz .s strong{display:block;font-size:30px;color:var(--ink)}
.st-big{display:flex;flex-direction:column;justify-content:center;gap:10px}
.st-big .d{font-size:64px;font-weight:800;line-height:1}
.st-big .tp{font-size:34px;font-weight:700;line-height:1.25}
.st-big .w{font-size:22px;color:var(--muted)}
.flyer{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.flyer img{max-width:100%;max-height:100%;object-fit:contain}
.dok{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.dr{display:grid;grid-template-columns:1fr 210px 150px;gap:22px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.dr:last-child{border-bottom:0}
.dr .j{font-size:26px;font-weight:700;line-height:1.2}
.dr .o{font-size:19px;color:var(--muted);margin-top:3px}
.dr .tg{font-size:20px;color:var(--muted);text-align:right}
.badge{justify-self:end;border-radius:999px;padding:8px 16px;font-size:19px;font-weight:800;white-space:nowrap}
.b-ok{background:rgba(30,146,89,.14);color:var(--green)}
.b-warn{background:rgba(232,150,46,.16);color:var(--amberStrong)}
.b-bad{background:rgba(224,106,74,.16);color:var(--coral)}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}
.kc{border-radius:18px;padding:18px 22px;background:rgba(var(--tint),.04);border:1px solid var(--line)}
.kc b{display:block;font-size:52px;font-weight:800;line-height:1.1}
.kc span{font-size:19px;color:var(--muted)}
.tl{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.tr2{display:grid;grid-template-columns:1fr 240px;gap:22px;align-items:center;padding:16px 20px;border-radius:16px;border:1px solid var(--line)}
.tr2 b{font-size:26px}
.tr2 .m{font-size:18px;color:var(--muted);margin-top:4px}
.pb{height:10px;border-radius:5px;background:rgba(var(--tint),.08);overflow:hidden}
.pb i{display:block;height:100%;border-radius:5px;background:var(--app)}
.pbl{display:flex;justify-content:space-between;font-size:17px;color:var(--muted);margin-bottom:6px}

/* ===== v6: kontrol 6 tombol ===== */
.ctl{grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:12px}
.ctl button{height:70px;font-size:12px;border-radius:14px}
.ctl button svg{width:26px;height:26px}
/* ===== kartu pembuka aplikasi ===== */
#intro{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
#intro.on{animation:introIn 2.4s cubic-bezier(.7,0,.2,1) both}
#intro .bg{position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,color-mix(in srgb,var(--app) 70%,#fff),var(--app) 55%,color-mix(in srgb,var(--app) 70%,#000))}
#intro .isi{position:relative;display:flex;align-items:center;gap:56px;color:#fff}
#intro .ik{width:220px;height:220px;border-radius:60px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center}
#intro .ik svg{width:130px;height:130px}
#intro .t1{font-size:30px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
#intro .t2{font-size:130px;font-weight:800;line-height:1;letter-spacing:-.02em}
#intro .t3{font-size:30px;opacity:.9;margin-top:12px}
#intro.on .ik{animation:popIk 2.4s ease both}
#intro.on .teks{animation:geser 2.4s ease both}
@keyframes introIn{0%{opacity:0;clip-path:circle(0% at 50% 50%)}18%{opacity:1;clip-path:circle(80% at 50% 50%)}78%{opacity:1;clip-path:circle(80% at 50% 50%)}100%{opacity:0;clip-path:circle(80% at 50% 50%)}}
@keyframes popIk{0%,10%{transform:scale(.4) rotate(-12deg);opacity:0}30%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.04)}}
@keyframes geser{0%,14%{transform:translateX(60px);opacity:0}34%{transform:none;opacity:1}100%{transform:translateX(-10px)}}
/* ===== LTI ===== */
.lti{display:grid;grid-template-columns:1fr 560px;gap:24px;height:100%}
.lti .hero{display:flex;flex-direction:column;justify-content:center;padding:40px 56px;position:relative;overflow:hidden}
.lti .hero .n{font-size:300px;font-weight:800;line-height:.9;letter-spacing:-.04em;color:var(--green);white-space:nowrap}
.lti .thn{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;position:relative}
.lti .thn span{background:rgba(30,146,89,.12);color:var(--green);font-weight:800;font-size:20px;border-radius:999px;padding:8px 18px}
.lti .hero .s1{font-size:44px;font-weight:800;margin-top:10px}
.lti .hero .s2{font-size:26px;color:var(--muted);margin-top:8px}
.lti .hero .daun{position:absolute;right:-190px;bottom:-200px;opacity:.06}
.mil{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;text-align:center}
.mil .m{font-size:26px;color:var(--muted);line-height:1.45}
.mil .m b{color:var(--ink)}
/* ===== KPI ===== */
.kpi{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.kr{display:grid;grid-template-columns:330px 1fr 1fr;gap:28px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.kr:last-child{border-bottom:0}
.kr .d{font-size:26px;font-weight:700;line-height:1.2}
.kh{display:grid;grid-template-columns:330px 1fr 1fr;gap:28px;font-size:17px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pb.besar{height:16px;border-radius:8px}
.pb.besar i{border-radius:8px;transform-origin:left;animation:tumbuhX 1s ease-out both}
/* ===== APD & kartu ===== */
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:20px}
.apd{padding:22px 24px;border-radius:18px;border:1px solid var(--line);background:rgba(var(--tint),.03)}
.apd.low{border-color:rgba(224,106,74,.45);background:rgba(224,106,74,.08)}
.apd b{display:block;font-size:24px;line-height:1.2;min-height:58px}
.apd .v{font-size:56px;font-weight:800;line-height:1.1;margin-top:8px}
.apd .v small{font-size:20px;font-weight:500;color:var(--muted)}
.apd .st{font-size:18px;font-weight:700;margin-top:6px}
/* ===== peta ===== */
.peta{position:relative;height:100%;overflow:hidden}
.peta svg{position:absolute;inset:0;width:100%;height:100%}
.ping{animation:ping 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.petaLeg{position:absolute;left:36px;bottom:30px;display:flex;gap:22px;font-size:20px;font-weight:600;background:var(--cardbg);padding:12px 20px;border-radius:14px;border:1px solid var(--line)}
.petaLeg span{display:flex;align-items:center;gap:8px}.petaLeg i{width:14px;height:14px;border-radius:50%}
/* ===== award ===== */
.awd{position:relative;height:100%;overflow:hidden;border-radius:22px;background:#0B1C15}
.awd .sl{position:absolute;inset:0;opacity:0;transition:opacity 1.2s}
.awd .sl.on{opacity:1}
.awd .sl img{width:100%;height:100%;object-fit:cover;animation:zoom 14s ease-out both}
.awd .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2B5A40,#0B1C15 70%)}
.awd .cap{position:absolute;left:0;right:0;bottom:0;padding:120px 48px 40px;background:linear-gradient(to top,rgba(4,16,11,.92),rgba(4,16,11,0));color:#fff}
.awd .cap .k{font-size:20px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#F4C76A}
.awd .cap .j{font-size:60px;font-weight:800;line-height:1.05;margin-top:8px}
.awd .cap .d{font-size:24px;color:#DCE8E0;margin-top:10px}
/* ===== kalender ===== */
.kal{display:grid;grid-template-columns:1fr 540px;gap:24px;height:100%}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:20px;text-align:center}
.cal .hd{font-size:16px;font-weight:800;color:var(--muted);letter-spacing:.08em}
.cal .c{height:62px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;position:relative}
.cal .c.x{color:var(--dim);opacity:.4}
.cal .c.today{outline:2px solid var(--app)}
.cal .c.due{background:var(--app);color:#fff;font-weight:800}
/* ===== workshop ===== */
.ws{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:22px}
.wc{padding:26px 28px;border-radius:20px;border:1px solid var(--line);background:rgba(var(--tint),.03);display:flex;flex-direction:column;gap:6px}
.wc .ic{width:58px;height:58px;border-radius:16px;background:rgba(30,146,89,.12);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.wc b{font-size:25px;line-height:1.2}
.wc .v{font-size:60px;font-weight:800;line-height:1.05}
.wc .v small{font-size:22px;font-weight:600;color:var(--muted)}
.wc .t{font-size:19px;color:var(--muted)}
/* ===== panel atur ===== */
#atur{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(5,15,10,.55);backdrop-filter:blur(4px)}
#atur.on{display:flex;animation:masuk .3s ease-out both}
.sheet{width:1640px;height:930px;border-radius:28px;background:var(--panel);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;color:var(--ink)}
.sh-top{display:flex;align-items:center;justify-content:space-between;padding:26px 36px;border-bottom:1px solid var(--line)}
.sh-top h2{font-size:36px;font-weight:800}
.sh-top p{font-size:19px;color:var(--muted);margin-top:4px}
.sh-body{flex:1;display:grid;grid-template-columns:1fr 520px;min-height:0}
.sh-list{overflow:auto;padding:18px 36px 30px;display:flex;flex-direction:column;gap:22px}
.sh-side{border-left:1px solid var(--line);padding:24px 30px;display:flex;flex-direction:column;gap:20px;overflow:auto}
.ag2 h3{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.ag2 h3 i{width:12px;height:12px;border-radius:50%}
.rw{display:grid;grid-template-columns:84px 1fr 150px 104px;gap:16px;align-items:center;padding:10px 14px;border-radius:14px;border:1px solid var(--line);margin-bottom:8px;background:rgba(var(--tint),.02)}
.rw.off{opacity:.5}
.rw .nm{font-size:22px;font-weight:700}
.rw .nm small{display:block;font-size:15px;font-weight:600;color:var(--dim);margin-top:2px}
.sw{width:76px;height:44px;border-radius:22px;border:0;background:rgba(var(--tint),.18);position:relative;cursor:pointer}
.sw::after{content:'';position:absolute;top:5px;left:5px;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:left .2s}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{left:37px}
.dur{display:flex;align-items:center;gap:6px}
.bt{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(var(--tint),.05);color:var(--ink);font:700 18px 'Plus Jakarta Sans',sans-serif;cursor:pointer;padding:0 12px}
.bt:hover,.bt:focus-visible,.sw:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.bt.pri{background:var(--green);border-color:var(--green);color:#fff}
.bt.big{height:58px;font-size:20px;padding:0 26px;border-radius:16px}
.dur span{min-width:54px;text-align:center;font-size:20px;font-weight:700}
.urt{display:flex;gap:6px;justify-content:flex-end}
.fld{display:flex;flex-direction:column;gap:8px}
.fld label{font-size:16px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fld input[type=text],.fld input[type=date]{height:54px;border-radius:14px;border:1px solid var(--line);background:rgba(var(--tint),.04);color:var(--ink);font:500 20px 'Plus Jakarta Sans',sans-serif;padding:0 16px}
.seg2{display:flex;gap:8px}.seg2 .bt{flex:1;height:52px}
.seg2 .bt[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:20px;font-weight:600}
.trow small{display:block;font-size:15px;color:var(--muted);font-weight:500}
.sh-foot{display:flex;justify-content:space-between;align-items:center;padding:18px 36px;border-top:1px solid var(--line);gap:16px}
.sh-foot .info{font-size:17px;color:var(--muted)}
/* PIN */
.pin{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;flex:1}
.pin .dots{display:flex;gap:18px}.pin .dots i{width:26px;height:26px;border-radius:50%;border:3px solid var(--muted)}
.pin .dots i.f{background:var(--green);border-color:var(--green)}
.pad{display:grid;grid-template-columns:repeat(3,110px);gap:16px}
.pad .bt{height:90px;font-size:38px;border-radius:22px}
.pin .er{height:28px;font-size:20px;color:var(--coral);font-weight:700}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
</style>
</head>
<body>
<div id="stage">
  <header id="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="36" height="40" viewBox="0 0 120 140"><path d="M60 132V44" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/><path d="M60 92C36 92 20 76 18 54c26 0 40 14 42 38Z" fill="#1E9259"/><path d="M60 70c24 0 40-16 42-38-26 0-40 14-42 38Z" fill="#8CC63F"/><path d="M60 44C49 31 51 15 60 2c9 13 11 29 0 42Z" fill="#145C3B"/></svg></div>
      <div>
        <div class="org">PT Arutmin Indonesia · Tambang Senakin</div>
        <div class="ttl"><span id="appJudul">Nursery &amp; Reklamasi</span> <span id="judul">· Memuat…</span></div>
      </div>
    </div>
    <div class="kanan">
      <div id="chip" class="demo"><i></i><span id="chipTeks">Menghubungkan…</span></div>
      <div class="jam"><div id="jam" class="num">--.--</div><div id="tgl">&nbsp;</div></div>
    </div>
  </header>

  <nav id="tabs" role="tablist" aria-label="Pilih layar"></nav>
  <main id="scenes"></main>
  <aside id="side"><div id="sideIsi" style="display:contents"></div>
    <div class="card ctl" id="ctl" role="toolbar" aria-label="Kontrol layar">
      <button type="button" id="bPrev" aria-label="Layar sebelumnya" title="Sebelumnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Mundur</button>
      <button type="button" id="bJeda" aria-label="Jeda atau putar" title="Jeda / putar"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span>Jeda</span></button>
      <button type="button" id="bNext" aria-label="Layar berikutnya" title="Berikutnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>Maju</button>
      <button type="button" id="bTema" aria-label="Ganti tema terang atau gelap" title="Ganti tema"></button>
      <button type="button" id="bPenuh" aria-label="Layar penuh" title="Layar penuh"></button>
      <button type="button" id="bAtur" aria-label="Atur layar" title="Atur layar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Atur</button>
    </div></aside>

  <footer id="ticker">
    <div id="tkLab">Info</div>
    <div id="tkWrap"><div id="tkRun"></div></div>
    <div id="jedaChip">JEDA</div>
  </footer>
  <div id="toast" role="status"></div>
  <div id="intro" aria-hidden="true"><div class="bg"></div><div class="isi"><div class="ik"></div><div class="teks"><div class="t1">PT Arutmin Indonesia · Senakin</div><div class="t2"></div><div class="t3"></div></div></div></div>
  <div id="atur" role="dialog" aria-modal="true" aria-label="Atur layar"><div class="sheet" id="sheet"></div></div>
</div>

<script>
(() => {
'use strict';

/* ================= PENGATURAN =================
   Isi alamat /exec tiap aplikasi. Kosongkan ('') bila belum dipasang.
   Bisa juga ditimpa lewat alamat: ?api=...&k3=...&env=...                */
const Q = new URLSearchParams(location.search);
const CONFIG = {
  API: {
    nursery: Q.get('api') ?? 'https://script.google.com/macros/s/AKfycbx-LIc65wCiM4I99LIS3C2bpspdI5hhJgCxvw4hcvwJuBvwF-P3eijIVFnA_gDF04_Z/exec',
    k3:      Q.get('k3')  ?? 'https://script.google.com/macros/s/AKfycbySUd2A54Jxo6nBJio2mwk8cRTr11x6yBVkFxg5QOmvSvvole7_LSZTd7b9WoOIdT_g/exec',   // SENSASI
    enviro:  Q.get('env') ?? 'https://script.google.com/macros/s/AKfycbwSj5jdTFE-y6xwPPnof9j02obllesxNB6JpGh5n5bfp5M9d4LWcm5SVf2Kjzxcv0QmbQ/exec'    // EnviroSync
  },
  KUNCI: Q.get('k') || '',
  HANYA: Q.get('app') || '',       // ?app=k3 hanya tampilkan K3
  DURASI: Math.max(6, Number(Q.get('d')) || 18),
  REFRESH: 60, TIMEOUT: 25,
  DEMO: Q.get('demo') === '1',
  GALERI_PER_LAYAR: 5,
  PIN_PRATINJAU: '1234'   // hanya dipakai di mode pratinjau; di TV asli PIN dicek oleh Nursery App (TV_PIN)
};
const TZ = 'Asia/Makassar';

/* ================= UTILITAS ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('id-ID');
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmtTgl = t => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(t || ''); return m ? `${+m[3]} ${BLN[+m[2]-1]} ${m[1]}` : esc(t); };
const jamStr = d => d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', timeZone:TZ});
const hariIni = () => { const n = new Date(new Date().toLocaleString('en-US', {timeZone:TZ})); n.setHours(0,0,0,0); return n; };
const sisaHari = t => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(t || ''); if (!m) return null; return Math.round((new Date(+m[1], +m[2]-1, +m[3]) - hariIni()) / 864e5); };

const PAL = {
  terang:{ink:'#15291F',muted:'#4F6A5B',dim:'#5E7868',grid:'rgba(20,70,45,.10)',track:'rgba(20,70,45,.05)',masuk:'#1E9259',keluar:'#E8962E',hazard:'#E06A4A',inspeksi:'#2F6FBF',
    app:{nursery:'#1E9259',k3:'#D9822B',enviro:'#2F6FBF'},
    kat:{'Fast Growing':'#8CC63F','Lokal':'#145C3B','Buah/MPTS':'#E8962E','Buah':'#E8962E','Cover Crop':'#3A78C9','Lainnya':'#5E7868'}},
  gelap:{ink:'#EDF5EF',muted:'#A9C2B3',dim:'#7F998A',grid:'rgba(220,255,235,.08)',track:'rgba(255,255,255,.05)',masuk:'#4FD08A',keluar:'#F4B860',hazard:'#F08A6C',inspeksi:'#7FB2F0',
    app:{nursery:'#4FD08A',k3:'#F4B860',enviro:'#7FB2F0'},
    kat:{'Fast Growing':'#B5E86E','Lokal':'#2FAF74','Buah/MPTS':'#F4B860','Buah':'#F4B860','Cover Crop':'#7FB2F0','Lainnya':'#7F998A'}}
};
const TK = 'nursery_tv_tema';
let tema = (() => { const q = Q.get('tema'); if (q === 'gelap' || q === 'terang') return q; try { return localStorage.getItem(TK) === 'gelap' ? 'gelap' : 'terang'; } catch (e) { return 'terang'; } })();
const P = () => PAL[tema];
const CAD = ['#C79BF2','#F08A6C','#5ED0D0','#E8D16A','#8A9BE8','#E87FB0'], wc = {};
const warna = k => P().kat[k] || wc[k] || (wc[k] = CAD[Object.keys(wc).length % CAD.length]);
function driveId(u){ const s = String(u||''); if (/^[\w-]{20,}$/.test(s)) return s; const m = s.match(/\/d\/([\w-]+)/) || s.match(/[?&]id=([\w-]+)/); return m ? m[1] : ''; }
const fotoUrl = (u, w = 1200) => { const id = driveId(u); return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w${w}` : ''; };
const bibit = w => `<svg width="${w}" height="${w*1.17}" viewBox="0 0 120 140" aria-hidden="true"><path d="M60 104V40" stroke="#1E9259" stroke-width="5" stroke-linecap="round"/><path d="M60 78C38 78 24 64 22 44c24 0 36 12 38 34Z" fill="#145C3B"/><path d="M60 60c22 0 36-14 38-34-24 0-36 12-38 34Z" fill="#8CC63F"/><path d="M60 42C50 30 52 16 60 4c8 12 10 26 0 38Z" fill="#1E9259"/><path d="M30 102h60l-7 36H37Z" fill="#7A5230"/><ellipse cx="60" cy="102" rx="30" ry="5" fill="#4A3220"/></svg>`;
const kamera = `<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#5E7868" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="4"/></svg>`;
const centang = `<svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="11" fill="#3A78C9"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ================= GRAFIK BULANAN (dipakai bersama) ================= */
function niceStep(m){ const raw = m/4||1, p = Math.pow(10,Math.floor(Math.log10(raw))), f = raw/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function grafik(tren, seri){
  const W=1330,H=520,L=96,T=34,B=60,n=tren.length || 1;
  const max = Math.max(1,...tren.flatMap(t => seri.map(s => t[s.k]||0))), step = niceStep(max), top = Math.ceil(max/step)*step;
  const y = v => T+(H-T-B)*(1-v/top);
  let g = '';
  for (let v=0; v<=top+0.1; v+=step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${P().grid}" stroke-width="1.5"/><text x="${L-14}" y="${y(v)+7}" text-anchor="end" font-size="19" fill="${P().dim}" font-family="Plus Jakarta Sans, sans-serif">${fmt(v)}</text>`;
  const gw = (W-L)/n, bw = seri.length > 1 ? 34 : 52; let bars = '';
  tren.forEach((t,i) => { const cx = L+gw*i+gw/2, m = +t.ym.slice(5,7)-1;
    const lab = BLN[m] + (m===0||i===0 ? ` ’${t.ym.slice(2,4)}` : '');
    seri.forEach((s,j) => { const v = t[s.k]||0, h = (H-T-B)*v/top, x = cx + (seri.length > 1 ? (j===0 ? -bw-4 : 4) : -bw/2);
      if (v > 0) { bars += `<rect class="bx" x="${x}" y="${y(v)}" width="${bw}" height="${h}" rx="5" fill="${s.w}" style="animation-delay:${i*55+j*25}ms"/>`;
        bars += `<text x="${x+bw/2}" y="${y(v)-9}" text-anchor="middle" font-size="16" font-weight="700" fill="${P().ink}" font-family="Plus Jakarta Sans, sans-serif">${v>=10000?Math.round(v/1000)+'rb':fmt(v)}</text>`; } });
    bars += `<text x="${cx}" y="${H-20}" text-anchor="middle" font-size="19" font-weight="600" fill="${P().muted}" font-family="Plus Jakarta Sans, sans-serif">${lab}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Grafik bulanan">${g}${bars}</svg>`;
}
const lgd = seri => `<div class="lgd">${seri.map(s => `<span><i style="background:${s.w}"></i>${s.l}</span>`).join('')}</div>`;
function barList(list, warnaFn, maxN = 8){
  const l = list.slice(0, maxN), max = l[0] ? Math.max(...l.map(o => o.jumlah)) : 1;
  return `<div class="jrows" style="justify-content:flex-start;gap:18px;margin-top:18px">${l.map((o,i) => `<div class="jr rise" style="--i:${i*0.4};grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 80px"><div class="jn" style="font-size:23px;white-space:normal;line-height:1.2">${esc(o.nama)}</div>
    <div class="track"><div class="bar" style="width:${Math.max(2,o.jumlah*100/max)}%;background:${warnaFn(o,i)};--i:${i}"></div></div><div class="jv num" style="font-size:28px">${fmt(o.jumlah)}</div></div>`).join('')}</div>`;
}

function rPeta(d){
  const t = d.titik.filter(o => isFinite(o.lat) && isFinite(o.lng)); if (!t.length) return '';

  if (b-a<0.01){a-=0.01;b+=0.01;} if (e-c<0.01){c-=0.01;e+=0.01;}
  const sc = Math.min((W-2*pad)/(e-c),(H-2*pad)/(b-a)), ox = (W-(e-c)*sc)/2, oy = (H-(b-a)*sc)/2;
  const X = g => ox+(g-c)*sc, Y = l => oy+(b-l)*sc;
  const st = k => { const p = d.pantau.find(o => o.titik === k); return !p ? 'belum' : (p.tidak ? 'tidak' : 'taat'); };
  const W8 = {taat:P().masuk, tidak:P().hazard, belum:P().dim};

/* ================= AMBIL DATA ================= */
const CONTOH = {nursery:contohNursery, k3:contohK3, enviro:contohEnviro};
const CK = a => 'tv_cache_' + a;
function muatCache(a){ try { const c = JSON.parse(localStorage.getItem(CK(a))); return c && c.data ? c : null; } catch (e) { return null; } }
function simpanCache(a, d){ try { localStorage.setItem(CK(a), JSON.stringify({data:d, waktu:new Date().toISOString()})); } catch (e) {} }
async function ambilApp(a){
  if (CONFIG.HANYA && CONFIG.HANYA !== a && a !== 'nursery') return; // Nursery tetap diambil untuk pengaturan
  const url0 = CONFIG.API[a];
  if (CONFIG.DEMO) { galat[a] = 'mode contoh'; const c = CONTOH[a]();
    if (a === 'nursery') { let p = null; try { p = JSON.parse(localStorage.getItem(CFGK)); } catch (e) {} c.pengaturan = p || contohPengaturan(); }
    terapkan(a, c, 'demo'); return; }
  if (!url0) return; // aplikasi ini belum disambungkan: dilewati
  const url = url0 + (url0.includes('?') ? '&' : '?') + 'tv=1' + (CONFIG.KUNCI ? '&k=' + encodeURIComponent(CONFIG.KUNCI) : '') + '&t=' + Date.now();
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), CONFIG.TIMEOUT*1000);
  try {
    const r = await fetch(url, {signal:ctl.signal, redirect:'follow'}); const teks = await r.text(); clearTimeout(to);
    let j; try { j = JSON.parse(teks); } catch (e) { throw new Error('Respons bukan JSON: kode TV belum terpasang atau deployment belum versi baru'); }
    if (!j.ok) throw new Error(j.error || 'Respons tidak valid');
    galat[a] = ''; simpanCache(a, j); terapkan(a, j, 'live');
  } catch (e) {
    clearTimeout(to); galat[a] = e.name === 'AbortError' ? 'Waktu tunggu habis' : (e.message || 'Gagal terhubung');
    if (data[a] && stat[a] !== 'demo') { stat[a] = 'offline'; chip(); return; }
    const c = muatCache(a); if (c) terapkan(a, c.data, 'offline'); else chip();
  }
}
const ambil = () => Promise.all(APPS.map(x => ambilApp(x.id)));

/* ================= KARTU PEMBUKA APLIKASI ================= */
let introSampai = 0;
const IKAPP = {
  nursery:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-9"/><path d="M12 13c-4 0-6-2-6.5-6 4 0 6 2 6.5 6z"/><path d="M12 11c4 0 6-2 6.5-6-4 0-6 2-6.5 6z"/><path d="M7 21h10"/></svg>',
  k3:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
  enviro:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5-3 8-7 8-12a8 8 0 0 0-16 0c0 5 3 9 8 12z"/><path d="M12 22V9"/><path d="M12 14l-3-3M12 12l3-3"/></svg>'
};
const SUBAPP = {nursery:'Pembibitan · reklamasi · workshop', k3:'Keselamatan & kesehatan kerja', enviro:'Kepatuhan & pemantauan lingkungan'};
function introApp(app){
  if (CONFIG.HANYA || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const el = $('#intro'), A = APPS.find(a => a.id === app);
  el.style.setProperty('--app', P().app[app]);
  el.querySelector('.ik').innerHTML = IKAPP[app]; el.querySelector('.t2').textContent = A.judul; el.querySelector('.t3').textContent = SUBAPP[app];
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  introSampai = performance.now() + 2400;
}

/* ================= PANEL ATUR LAYAR ================= */
let panelBuka = false, draft = null, pinIsi = '', pinBenar = '';
const salin = o => JSON.parse(JSON.stringify(o));
async function cekPin(pin){
  if (CONFIG.DEMO || !CONFIG.API.nursery) return pin === CONFIG.PIN_PRATINJAU;
  try { const r = await fetch(CONFIG.API.nursery + '?tv=1&aksi=cekpin&k=' + encodeURIComponent(CONFIG.KUNCI) + '&pin=' + encodeURIComponent(pin) + '&t=' + Date.now(), {redirect:'follow'});
    const j = JSON.parse(await r.text()); return !!j.ok; } catch (e) { toast('Tidak bisa menghubungi Nursery App'); return false; }
}
async function simpanKeServer(p){
  if (CONFIG.DEMO || !CONFIG.API.nursery) { try { localStorage.setItem(CFGK, JSON.stringify(p)); } catch (e) {} return true; }
  const r = await fetch(CONFIG.API.nursery + '?tv=1&aksi=simpan&k=' + encodeURIComponent(CONFIG.KUNCI) + '&pin=' + encodeURIComponent(pinBenar) + '&data=' + encodeURIComponent(JSON.stringify({layar:p.layar, umum:p.umum})) + '&t=' + Date.now(), {redirect:'follow'});
  const j = JSON.parse(await r.text()); if (!j.ok) throw new Error(j.error || 'Gagal menyimpan'); return true;
}
function bukaPanel(){
  panelBuka = true; pinIsi = ''; $('#atur').classList.add('on'); rPin('');
  if (!jeda) { sisa = performance.now() - mulai; }
}
function tutupPanel(){
  panelBuka = false; $('#atur').classList.remove('on'); $('#sheet').innerHTML = '';
  mulai = performance.now() - (sisa || 0);
}
function rPin(er){
  $('#sheet').innerHTML = `<div class="sh-top"><div><h2>Atur layar</h2><p>Masukkan PIN admin untuk mengubah tampilan</p></div><button type="button" class="bt big" data-act="tutup">Tutup</button></div>
    <div class="pin"><div class="dots">${[0,1,2,3,4,5].slice(0, Math.max(4, pinIsi.length)).map(i => `<i class="${i < pinIsi.length ? 'f' : ''}"></i>`).join('')}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button type="button" class="bt" data-pin="${n}">${n}</button>`).join('')}<button type="button" class="bt" data-act="hapus" aria-label="Hapus">⌫</button><button type="button" class="bt" data-pin="0">0</button><button type="button" class="bt pri" data-act="masuk">OK</button></div>
    <div class="er">${esc(er||'')}</div></div>`;
}
function urutApp(app){ return SCENES.filter(s => s.app === app).sort((a,b) => sd(a.id).urut - sd(b.id).urut); }
function sd(id){ const sc = SCENES.find(s => s.id === id), l = draft.layar[id] || {};
  return {on: l.on !== false, urut: isFinite(l.urut) ? +l.urut : sc.urutBawaan, dur: +l.dur || 0}; }
function setSd(id, k, v){ draft.layar[id] = Object.assign({}, draft.layar[id] || {}, {[k]: v}); }
function rPanel(){
  const durB = +draft.umum.durasi || 18;
  const grup = APPS.map(a => `<div class="ag2"><h3><i style="background:${P().app[a.id]}"></i>${esc(a.judul)}</h3>${urutApp(a.id).map((sc,i,arr2) => { const v = sd(sc.id), ada = data[sc.app] && (()=>{ try { return sc.aktif(data[sc.app]); } catch (e) { return false; } })();
    return `<div class="rw ${v.on?'':'off'}"><button type="button" class="sw" role="switch" aria-checked="${v.on}" aria-label="Tampilkan ${esc(sc.judul)}" data-act="on" data-id="${sc.id}"></button>
      <div class="nm">${esc(sc.judul)}<small>${[!ada ? 'Belum ada data, otomatis dilewati' : '', sc.internal ? 'Disembunyikan saat mode tamu' : ''].filter(Boolean).join(' · ') || '&nbsp;'}</small></div>
      <div class="dur"><button type="button" class="bt" data-act="dur-" data-id="${sc.id}" aria-label="Kurangi durasi">−</button><span>${v.dur || durB}s</span><button type="button" class="bt" data-act="dur+" data-id="${sc.id}" aria-label="Tambah durasi">+</button></div>
      <div class="urt"><button type="button" class="bt" data-act="naik" data-id="${sc.id}" aria-label="Naikkan urutan" ${i===0?'disabled style="opacity:.3"':''}>↑</button><button type="button" class="bt" data-act="turun" data-id="${sc.id}" aria-label="Turunkan urutan" ${i===arr2.length-1?'disabled style="opacity:.3"':''}>↓</button></div></div>`; }).join('')}</div>`).join('');
  $('#sheet').innerHTML = `<div class="sh-top"><div><h2>Atur layar</h2><p>Pilih layar yang tampil, urutan, dan lamanya. Tersimpan untuk semua TV.</p></div><button type="button" class="bt big" data-act="tutup">Batal</button></div>
    <div class="sh-body"><div class="sh-list">${grup}</div>
    <div class="sh-side">
      <div class="fld"><label>Tema awal TV</label><div class="seg2"><button type="button" class="bt" data-act="tema" data-v="terang" aria-pressed="${draft.umum.tema!=='gelap'}">Terang</button><button type="button" class="bt" data-act="tema" data-v="gelap" aria-pressed="${draft.umum.tema==='gelap'}">Gelap</button></div></div>
      <div class="trow"><div>Mode tamu<small>Sembunyikan layar internal saat ada kunjungan</small></div><button type="button" class="sw" role="switch" aria-checked="${!!draft.umum.tamu}" aria-label="Mode tamu" data-act="tamu"></button></div>
      <div class="trow"><div>Durasi bawaan<small>Untuk layar yang tidak diatur khusus</small></div><div class="dur"><button type="button" class="bt" data-act="durB-">−</button><span>${durB}s</span><button type="button" class="bt" data-act="durB+">+</button></div></div>
      <div class="fld"><label for="fTeks">Teks berjalan tambahan</label><input id="fTeks" type="text" maxlength="160" value="${esc(draft.umum.teks||'')}" placeholder="Contoh: Selamat datang tim penilai PROPER"></div>
      <div class="fld"><label for="fLti">Tanggal fatality terakhir</label><input id="fLti" type="date" value="${esc(draft.umum.lti||'')}"></div>
      <div class="sh-foot" style="padding:0;border:0;margin-top:auto"><span class="info">Target KPI &amp; jadwal pelaporan diisi di sheet <b>TV_Target</b> dan <b>TV_Jadwal</b>.</span></div>
    </div></div>
    <div class="sh-foot"><button type="button" class="bt big" data-act="bawaan">Kembalikan bawaan</button><span class="info" id="infoSimpan"></span><button type="button" class="bt big pri" data-act="simpan">Simpan &amp; terapkan</button></div>`;
}
$('#sheet').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return; e.stopPropagation();
  const act = b.dataset.act, id = b.dataset.id;
  if (b.dataset.pin !== undefined) { if (pinIsi.length < 8) pinIsi += b.dataset.pin; rPin(''); return; }
  if (act === 'tutup') return tutupPanel();
  if (act === 'hapus') { pinIsi = pinIsi.slice(0,-1); rPin(''); return; }
  if (act === 'masuk') { const p = pinIsi; rPin('Memeriksa…');
    if (await cekPin(p)) { pinBenar = p; draft = salin(cfg); rPanel(); }
    else { pinIsi = ''; rPin('PIN salah'); const d = $('#sheet .dots'); if (d) d.classList.add('shake'); }
    return; }
  if (!draft) return;
  const ambilInput = () => { const t = $('#fTeks'), l = $('#fLti'); if (t) draft.umum.teks = t.value.trim(); if (l) draft.umum.lti = l.value; };
  ambilInput();
  const durB = +draft.umum.durasi || 18;
  if (act === 'on') setSd(id, 'on', !sd(id).on);
  else if (act === 'dur-' || act === 'dur+') { const v = sd(id).dur || durB; setSd(id, 'dur', Math.max(6, Math.min(120, v + (act === 'dur+' ? 5 : -5)))); }
  else if (act === 'naik' || act === 'turun') { const sc = SCENES.find(x => x.id === id), l = urutApp(sc.app), i = l.findIndex(x => x.id === id), j = act === 'naik' ? i-1 : i+1;
    if (j >= 0 && j < l.length) { [l[i], l[j]] = [l[j], l[i]]; l.forEach((x,k) => setSd(x.id, 'urut', k)); } }
  else if (act === 'tema') draft.umum.tema = b.dataset.v;
  else if (act === 'tamu') draft.umum.tamu = !draft.umum.tamu;
  else if (act === 'durB-' || act === 'durB+') draft.umum.durasi = Math.max(6, Math.min(120, durB + (act === 'durB+' ? 2 : -2)));
  else if (act === 'bawaan') { draft.layar = {}; draft.umum.durasi = 18; draft.umum.tamu = false; }
  else if (act === 'simpan') {
    $('#infoSimpan').textContent = 'Menyimpan…';
    try { await simpanKeServer(draft); terimaPengaturan(salin(draft)); if (draft.umum.tema) { tema = draft.umum.tema === 'gelap' ? 'gelap' : 'terang'; try { localStorage.removeItem(TK); } catch (x) {} terapkanTema(); segarkanTombol(); }
      tutupPanel(); hitungVis(); idx = 0; appTampil = ''; bangunTabs(); rTicker(); tampil(0); toast('Pengaturan tersimpan'); }
    catch (er) { $('#infoSimpan').textContent = er.message || 'Gagal menyimpan'; }
    return; }
  rPanel();
});

/* ================= KONTROL ================= */
function fit(){ const s = Math.min(innerWidth/1920, innerHeight/1080); $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3500); }
const IK = {
  matahari:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  bulan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  buka:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  tutup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
  jeda:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  putar:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>'
};
function segarkanTombol(){
  $('#bTema').innerHTML = tema === 'terang' ? IK.bulan+'Gelap' : IK.matahari+'Terang';
  const penuh = !!(document.fullscreenElement || document.webkitFullscreenElement);
  $('#bPenuh').innerHTML = penuh ? IK.tutup+'Normal' : IK.buka+'Penuh';
  $('#bJeda').innerHTML = jeda ? IK.putar+'Putar' : IK.jeda+'Jeda';
  $('#bJeda').classList.toggle('aktif', jeda);
}
function togelJeda(){ jeda = !jeda; document.body.classList.toggle('jeda', jeda); if (jeda) sisa = performance.now()-mulai; else mulai = performance.now()-sisa; segarkanTombol(); }
function layarPenuh(){
  const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen, exit = document.exitFullscreen || document.webkitExitFullscreen;
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) { exit.call(document); return; }
    if (!req) { toast('Browser TV ini tidak mendukung layar penuh'); return; }
    const r = req.call(el); if (r && r.catch) r.catch(() => toast('Layar penuh ditolak browser. Coba sekali lagi.'));
  } catch (e) { toast('Layar penuh tidak tersedia di browser ini'); }
}
function terapkanTema(){ document.body.classList.toggle('gelap', tema === 'gelap'); }
function gantiTema(){
  tema = tema === 'terang' ? 'gelap' : 'terang';
  try { localStorage.setItem(TK, tema); } catch (e) {}
  terapkanTema(); segarkanTombol();
  if (vis.length) { bangunTabs(); tampil(idx, {tetap:true}); }
  toast(tema === 'gelap' ? 'Tema gelap' : 'Tema terang');
}
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return; const k = e.key;
  if (panelBuka) {
    if (k === 'Escape') tutupPanel();
    else if (!draft && /^[0-9]$/.test(k)) { pinIsi += k; rPin(''); }
    else if (!draft && k === 'Backspace') { pinIsi = pinIsi.slice(0,-1); rPin(''); }
    else if (!draft && k === 'Enter') { e.preventDefault(); $('#sheet [data-act="masuk"]').click(); }
    return;
  }
  if (k === 'a' || k === 'A') { bukaPanel(); return; }
  if (k === 'ArrowRight' || k === 'PageDown' || k === 'n') tampil(idx+1);
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'p') tampil(idx-1);
  else if (k === ' ') { e.preventDefault(); togelJeda(); }
  else if (k === 'f' || k === 'F') layarPenuh();
  else if (k === 't' || k === 'T') gantiTema();
  else if (k === 'r' || k === 'R') { toast('Menyegarkan data…'); ambil(); }
  else if (/^[1-9]$/.test(k) && vis[+k-1]) tampil(+k-1);
});
$('#stage').addEventListener('click', e => {
  if (e.target.closest('#tabs') || e.target.closest('#ctl') || e.target.closest('#atur')) return;
  const r = $('#stage').getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  if (x < 0.3) tampil(idx-1); else if (x > 0.7) tampil(idx+1); else togelJeda();
});
let sepiT; const bangun = () => { document.body.classList.remove('sepi'); clearTimeout(sepiT); sepiT = setTimeout(() => document.body.classList.add('sepi'), 3000); };
addEventListener('mousemove', bangun); addEventListener('touchstart', bangun, {passive:true}); bangun();
addEventListener('resize', fit); addEventListener('online', ambil);
function detak(){ const n = new Date();
  $('#jam').textContent = n.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', timeZone:TZ});
  $('#tgl').textContent = n.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:TZ}); }
setInterval(detak, 1000); detak();
setInterval(() => { if (!vis.length) return; const lewat = jeda ? sisa : performance.now()-mulai;
  if (panelBuka) return;
  const dur = (Q.get('d') ? CONFIG.DURASI : setelan(vis[idx].id).dur) + (introSampai > performance.now() ? 0 : 0);
  const em = document.querySelector(`.segs button[data-i="${idx}"] em`); if (em) em.style.width = Math.min(100, lewat/(dur*10)) + '%';
  if (!jeda && lewat >= dur*1000) tampil(idx+1); }, 100);

$('#bPrev').addEventListener('click', () => tampil(idx-1));
$('#bNext').addEventListener('click', () => tampil(idx+1));
$('#bJeda').addEventListener('click', togelJeda);
$('#bTema').addEventListener('click', gantiTema);
$('#bPenuh').addEventListener('click', layarPenuh);
$('#bAtur').addEventListener('click', bukaPanel);
document.addEventListener('fullscreenchange', segarkanTombol);
document.addEventListener('webkitfullscreenchange', segarkanTombol);
terapkanTema(); segarkanTombol();
fit(); ambil(); setInterval(ambil, CONFIG.REFRESH*1000);
})();
</script>
</body>
</html>
