<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layar Nursery - PT Arutmin Indonesia Tambang Senakin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap">
<style>
:root{
  --tint:20,70,45; --bg:#F2F5F1; --panel:#FFFFFF; --panel2:#FFFFFF; --line:rgba(20,70,45,.10);
  --cardbg:#FFFFFF; --shadow:0 1px 2px rgba(20,60,40,.05),0 10px 28px rgba(20,60,40,.07);
  --tag:#FFFFFF; --amberText:#8E5208; --amberStrong:#B36A0E; --body:#2E4639; --ph1:#E4F1E7; --ph2:#F6FAF6;
  --stagebg:radial-gradient(1200px 700px at 80% -15%,rgba(140,198,63,.16),transparent 60%),radial-gradient(900px 600px at -5% 110%,rgba(58,120,201,.07),transparent 60%),#F2F5F1;
  --ink:#15291F; --muted:#4F6A5B; --dim:#5E7868;
  --green:#1E9259; --lime:#3F7E14; --amber:#E8962E; --blue:#3A78C9; --coral:#E06A4A;
}
body.gelap{
  --tint:255,255,255; --bg:#07130E; --panel:#0F241B; --panel2:#132C21; --line:rgba(220,255,235,.09);
  --ink:#EDF5EF; --muted:#A9C2B3; --dim:#7F998A;
  --green:#4FD08A; --lime:#B5E86E; --amber:#F4B860; --blue:#7FB2F0; --coral:#F08A6C;
  --cardbg:linear-gradient(180deg,#132C21,#0F241B); --shadow:none;
  --tag:rgba(4,16,11,.8); --amberText:#F4B860; --amberStrong:#F4B860; --body:#D4E4DA; --ph1:#1D4A33; --ph2:#0F241B;
  --stagebg:radial-gradient(1200px 700px at 78% -10%,rgba(79,208,138,.10),transparent 60%),radial-gradient(900px 600px at -5% 110%,rgba(127,178,240,.06),transparent 60%),#07130E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
body.sepi{cursor:none}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;
  background:var(--stagebg);transition:background .4s}

/* header */
#top{position:absolute;left:40px;right:40px;top:0;height:108px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:20px}
.logo{width:62px;height:62px;border-radius:18px;background:linear-gradient(145deg,#1E5A3D,#0F3524);border:1px solid rgba(181,232,110,.25);display:flex;align-items:center;justify-content:center}
.org{font-size:17px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--lime)}
.ttl{font-size:38px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.ttl span{color:var(--muted);font-weight:500}
.kanan{display:flex;align-items:center;gap:32px}
#chip{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:rgba(var(--tint),.03);border-radius:999px;padding:10px 20px;font-size:19px;font-weight:600;color:var(--muted);max-width:520px}
#chip i{width:12px;height:12px;border-radius:50%;flex:none;background:var(--green);box-shadow:0 0 0 0 rgba(79,208,138,.6);animation:nadi 2s infinite}
#chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chip.offline i{background:var(--amber);animation:none}
#chip.demo i{background:var(--coral);animation:none}
@keyframes nadi{0%{box-shadow:0 0 0 0 rgba(79,208,138,.55)}70%{box-shadow:0 0 0 12px rgba(79,208,138,0)}100%{box-shadow:0 0 0 0 rgba(79,208,138,0)}}
.jam{text-align:right}
#jam{font-size:50px;font-weight:800;line-height:1}
#tgl{font-size:19px;color:var(--muted);margin-top:4px}

/* tabs / progress */
#tabs{position:absolute;left:40px;top:124px;width:1404px;display:flex;gap:10px}
#tabs button{flex:1;background:none;border:0;color:var(--dim);font:600 17px 'Plus Jakarta Sans',sans-serif;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:9px;padding:4px 0;min-height:44px}
#tabs button b{display:block;height:5px;border-radius:3px;background:rgba(var(--tint),.10);overflow:hidden}
#tabs button b em{display:block;height:100%;width:0;background:var(--green);border-radius:3px}
#tabs button.done b em{width:100%;background:rgba(79,208,138,.45)}
#tabs button.on{color:var(--ink)}
#tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:4px}

/* main + side */
#scenes{position:absolute;left:40px;top:196px;width:1404px;height:802px}
#side{position:absolute;left:1468px;top:124px;width:412px;height:874px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--cardbg);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.lab{font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.big{padding:26px 28px}
.big .v{font-size:96px;font-weight:800;line-height:1;margin:12px 0 4px}
.big .u{font-size:20px;color:var(--muted)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-top:20px;gap:3px}
.stack i{display:block;height:100%}
.slg{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:16px;color:var(--muted)}
.slg span{display:flex;align-items:center;gap:8px}
.slg i{width:12px;height:12px;border-radius:3px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini{padding:20px 22px}
.mini .v{font-size:44px;font-weight:800;line-height:1.1;margin-top:8px}
.mini .s{font-size:16px;color:var(--dim)}
.bln{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.bln .row{display:flex;justify-content:space-between;align-items:baseline}
.bln .row b{font-size:34px;font-weight:800}
.bln .row span{font-size:19px;color:var(--muted)}
.bln .kecil{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bln .kecil div{background:rgba(var(--tint),.04);border-radius:12px;padding:10px 12px}
.bln .kecil b{display:block;font-size:24px;font-weight:800}
.bln .kecil span{font-size:15px;color:var(--muted)}
.ctl{margin-top:auto;padding:14px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ctl button{height:72px;border-radius:16px;border:1px solid var(--line);background:rgba(var(--tint),.05);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 13px 'Plus Jakarta Sans',sans-serif;transition:background .2s,transform .1s}
.ctl button svg{width:28px;height:28px}
.ctl button:hover,.ctl button:focus-visible{background:var(--green);color:#fff;border-color:var(--green);outline:none}
.ctl button:active{transform:scale(.95)}
.ctl button.aktif{background:var(--amber);color:#2B1708;border-color:var(--amber)}

/* ticker */
#ticker{position:absolute;left:0;right:0;bottom:0;height:66px;background:#0F3B27;border-top:1px solid var(--line);display:flex;align-items:center;overflow:hidden}
#tkLab{flex:none;height:100%;display:flex;align-items:center;padding:0 28px 0 40px;background:#B9E57C;color:#0F3B27;font-size:19px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%);padding-right:48px}
#tkWrap{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
#tkRun{display:inline-block;padding-left:100%;font-size:23px;font-weight:500;color:#fff;animation:jalan linear infinite}
#tkRun em{font-style:normal;color:#B9E57C;font-weight:700;margin:0 28px}
@keyframes jalan{from{transform:translateX(0)}to{transform:translateX(-100%)}}
#jedaChip{display:none;flex:none;margin:0 24px;background:var(--amber);color:#2B1708;border-radius:999px;padding:6px 16px;font-size:17px;font-weight:800}
body.jeda #jedaChip{display:block}

/* animasi scene */
.scene{width:100%;height:100%;animation:masuk .55s ease-out both}
@keyframes masuk{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes naik{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes tumbuhX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tumbuhY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes sapu{from{stroke-dasharray:0 var(--c)}}
@keyframes zoom{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.rise{animation:naik .6s ease-out both;animation-delay:calc(var(--i,0) * 80ms)}
.pnl{padding:30px 36px}
.h{display:flex;justify-content:space-between;align-items:center;gap:20px}
.h .lab{font-size:18px}
.lgd{display:flex;gap:24px;font-size:18px;font-weight:600;color:var(--muted)}
.lgd span{display:flex;align-items:center;gap:9px}
.lgd i{width:16px;height:16px;border-radius:4px}

/* komposisi */
.komp{display:grid;grid-template-columns:600px 1fr;gap:24px;height:100%}
.donut{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.seg{animation:sapu 1.2s ease-out both}
.kats{display:flex;flex-direction:column;gap:16px}
.kat{padding:24px 28px;display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:center}
.kat .n{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:700}
.kat .n i{width:18px;height:18px;border-radius:5px}
.kat .v{font-size:40px;font-weight:800;text-align:right}
.kat .j{font-size:19px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kat .p{font-size:20px;color:var(--muted);text-align:right}
.kat .tr{grid-column:1/-1;height:8px;border-radius:4px;background:rgba(var(--tint),.07);overflow:hidden;margin-top:6px}
.kat .tr b{display:block;height:100%;border-radius:4px;transform-origin:left;animation:tumbuhX 1s ease-out both}

/* jenis */
.jenis{height:100%;display:flex;flex-direction:column;gap:18px}
.jrows{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.jr{display:grid;grid-template-columns:44px 300px 1fr 150px;gap:20px;align-items:center}
.rk{font-size:22px;font-weight:700;color:var(--dim)}
.jn{font-size:28px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:30px;border-radius:8px;background:rgba(var(--tint),.05);overflow:hidden}
.bar{height:100%;border-radius:8px;transform-origin:left;animation:tumbuhX .9s ease-out both;animation-delay:calc(var(--i,0) * 60ms)}
.jv{font-size:32px;font-weight:800;text-align:right}
.cat{font-size:17px;color:var(--dim)}

/* tren */
.tren{height:100%;display:flex;flex-direction:column;gap:18px}
.tsvg{flex:1;min-height:0;padding-top:10px}
.tsvg svg{width:100%;height:100%;display:block}
.bx{transform-box:fill-box;transform-origin:center bottom;animation:tumbuhY .9s ease-out both}
.st3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;flex:none}
.st{padding:20px 26px}
.st .v{font-size:42px;font-weight:800;margin-top:6px}
.st .v small{font-size:20px;font-weight:500;color:var(--muted)}

/* kamus */
.spot{display:grid;grid-template-columns:640px 1fr;gap:24px;height:100%}
.foto{position:relative;overflow:hidden}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:zoom 20s ease-out both}
.fb{position:absolute;inset:0;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,var(--ph1),var(--ph2) 70%)}
.foto .tag{position:absolute;left:24px;top:24px;background:var(--tag);box-shadow:0 4px 14px rgba(20,60,40,.12);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:18px;font-weight:700}
.sptx{display:flex;flex-direction:column;justify-content:center;gap:18px}
.sptx .nm{font-size:92px;font-weight:800;line-height:1;letter-spacing:-.02em}
.sptx .il{font-size:34px;font-style:italic;font-weight:500;color:var(--lime)}
.fk2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.fk{background:rgba(var(--tint),.04);border:1px solid var(--line);border-radius:16px;padding:16px 22px}
.fk span{display:block;font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fk b{font-size:36px;font-weight:800}
.mf{font-size:26px;line-height:1.5;color:var(--body);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.hit{font-size:18px;color:var(--dim)}

/* kegiatan */
.akt{display:grid;gap:24px;height:100%}
.list{display:flex;flex-direction:column;margin-top:14px}
.krow{display:grid;grid-template-columns:120px 1fr 200px;gap:22px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.krow:last-child{border-bottom:0}
.kt{text-align:center;border-radius:14px;background:rgba(79,208,138,.10);border:1px solid rgba(79,208,138,.25);padding:8px 6px}
.kt b{display:block;font-size:34px;font-weight:800;line-height:1}
.kt span{font-size:16px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.08em}
.kn{font-size:28px;font-weight:700}
.ks{font-size:20px;color:var(--muted);margin-top:4px}
.kj{font-size:34px;font-weight:800;text-align:right}
.kj small{font-size:18px;font-weight:500;color:var(--muted)}
.pgi{border-left:0;background:rgba(244,184,96,.08);border:1px solid rgba(244,184,96,.25);border-radius:16px;padding:18px 22px;margin-top:14px}
.pgi small{display:block;font-size:15px;font-weight:800;letter-spacing:.1em;color:var(--amberText);text-transform:uppercase;margin-bottom:6px}
.pgi p{font-size:24px;line-height:1.4}
.kosong{font-size:22px;color:var(--dim);margin-top:20px}

/* galeri */
.gal{display:grid;gap:18px;height:100%}
.gt{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);background:radial-gradient(circle at 50% 35%,var(--ph1),var(--ph2) 70%)}
.gt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gt.besar{grid-row:span 2}
.gph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.gcap{color:#fff;position:absolute;left:0;right:0;bottom:0;padding:70px 26px 22px;background:linear-gradient(to top,rgba(4,16,11,.95),rgba(4,16,11,0))}
.gcap b{display:block;font-size:28px;line-height:1.2}
.gt.besar .gcap b{font-size:40px}
.gcap span{font-size:18px;color:#DCE8E0}

/* agenda */
.agd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:20px}
.ag{padding:22px 26px;background:rgba(var(--tint),.03);border:1px solid var(--line);border-radius:18px}
.ag b{font-size:30px;display:block}
.ag p{font-size:22px;color:var(--muted);margin-top:4px}
.ag .w{margin-top:10px;font-size:20px;font-weight:700;color:var(--green)}

/* siklus */
.sik{height:100%;display:grid;grid-template-rows:auto 1fr;gap:24px}
.lgk{position:relative;margin-top:30px}
.garis{position:absolute;top:52px;left:8%;right:8%;height:3px;background:linear-gradient(90deg,var(--green),var(--amber));transform-origin:left;animation:tumbuhX 1.4s ease-out both;opacity:.6}
.lgr{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.ls{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.lb{width:106px;height:106px;border-radius:50%;background:var(--panel);border:3px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:var(--green)}
.lb.t{border-color:var(--amber);color:var(--amberStrong)}
.ls b{font-size:30px}
.ls span{font-size:20px;color:var(--muted);line-height:1.35}
.k3g{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
.k3i{display:flex;gap:18px;align-items:center;font-size:27px;line-height:1.3;background:rgba(127,178,240,.06);border:1px solid rgba(127,178,240,.18);border-radius:16px;padding:18px 22px}
.k3p{margin-top:18px;font-size:22px;color:var(--blue);font-weight:600}

#toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--green);color:#fff;font-weight:700;font-size:22px;padding:10px 28px;border-radius:999px;transition:opacity .5s;opacity:0;pointer-events:none;white-space:nowrap;z-index:5}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* === grup aplikasi pada tab === */
#tabs{display:flex;gap:30px}
.grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.grp .nm{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.grp .nm i{width:10px;height:10px;border-radius:50%;flex:none}
.grp.on .nm{color:var(--ink)}
.segs{display:flex;gap:6px}
.segs button{flex:1;min-width:0;height:30px;padding:0;background:none;border:0;cursor:pointer;display:flex;align-items:center}
.segs button b{display:block;width:100%;height:6px;border-radius:3px;background:rgba(var(--tint),.10);overflow:hidden}
.segs button b em{display:block;height:100%;width:0;border-radius:3px;background:var(--app)}
.segs button.done b em{width:100%;opacity:.45}
.segs button:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}
#appJudul{color:var(--ink);font-weight:800}
#stage{--app:#1E9259}
/* === K3 & lingkungan === */
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;height:100%}
.ring{display:flex;align-items:center;gap:30px;margin-top:18px}
.ring .t b{display:block;font-size:56px;font-weight:800;line-height:1}
.ring .t span{font-size:20px;color:var(--muted)}
.izl{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.iz{display:grid;grid-template-columns:1fr auto;gap:4px 20px;padding:18px 22px;border-radius:16px;background:rgba(var(--tint),.04);border:1px solid var(--line)}
.iz b{font-size:27px}
.iz .m{font-size:20px;color:var(--muted)}
.iz .s{grid-row:span 2;align-self:center;text-align:right;font-size:18px;color:var(--muted)}
.iz .s strong{display:block;font-size:30px;color:var(--ink)}
.st-big{display:flex;flex-direction:column;justify-content:center;gap:10px}
.st-big .d{font-size:64px;font-weight:800;line-height:1}
.st-big .tp{font-size:34px;font-weight:700;line-height:1.25}
.st-big .w{font-size:22px;color:var(--muted)}
.flyer{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.flyer img{max-width:100%;max-height:100%;object-fit:contain}
.dok{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.dr{display:grid;grid-template-columns:1fr 210px 150px;gap:22px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.dr:last-child{border-bottom:0}
.dr .j{font-size:26px;font-weight:700;line-height:1.2}
.dr .o{font-size:19px;color:var(--muted);margin-top:3px}
.dr .tg{font-size:20px;color:var(--muted);text-align:right}
.badge{justify-self:end;border-radius:999px;padding:8px 16px;font-size:19px;font-weight:800;white-space:nowrap}
.b-ok{background:rgba(30,146,89,.14);color:var(--green)}
.b-warn{background:rgba(232,150,46,.16);color:var(--amberStrong)}
.b-bad{background:rgba(224,106,74,.16);color:var(--coral)}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}
.kc{border-radius:18px;padding:18px 22px;background:rgba(var(--tint),.04);border:1px solid var(--line)}
.kc b{display:block;font-size:52px;font-weight:800;line-height:1.1}
.kc span{font-size:19px;color:var(--muted)}
.tl{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.tr2{display:grid;grid-template-columns:1fr 240px;gap:22px;align-items:center;padding:16px 20px;border-radius:16px;border:1px solid var(--line)}
.tr2 b{font-size:26px}
.tr2 .m{font-size:18px;color:var(--muted);margin-top:4px}
.pb{height:10px;border-radius:5px;background:rgba(var(--tint),.08);overflow:hidden}
.pb i{display:block;height:100%;border-radius:5px;background:var(--app)}
.pbl{display:flex;justify-content:space-between;font-size:17px;color:var(--muted);margin-bottom:6px}
</style>
</head>
<body>
<div id="stage">
  <header id="top">
    <div class="brand">

/* ================= GRAFIK BULANAN (dipakai bersama) ================= */
function niceStep(m){ const raw = m/4||1, p = Math.pow(10,Math.floor(Math.log10(raw))), f = raw/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function grafik(tren, seri){
  const W=1330,H=520,L=96,T=34,B=60,n=tren.length || 1;
  const max = Math.max(1,...tren.flatMap(t => seri.map(s => t[s.k]||0))), step = niceStep(max), top = Math.ceil(max/step)*step;
  const y = v => T+(H-T-B)*(1-v/top);
  let g = '';
  for (let v=0; v<=top+0.1; v+=step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${P().grid}" stroke-width="1.5"/><text x="${L-14}" y="${y(v)+7}" text-anchor="end" font-size="19" fill="${P().dim}" font-family="Plus Jakarta Sans, sans-serif">${fmt(v)}</text>`;
  const gw = (W-L)/n, bw = seri.length > 1 ? 34 : 52; let bars = '';

    bars += `<text x="${cx}" y="${H-20}" text-anchor="middle" font-size="19" font-weight="600" fill="${P().muted}" font-family="Plus Jakarta Sans, sans-serif">${lab}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Grafik bulanan">${g}${bars}</svg>`;
}

/* ================= SCENE: K3 (SENSASI) ================= */
function cincin(persen, warnaC){
  const R = 70, C = 2*Math.PI*R, len = C*Math.max(0,Math.min(100,persen))/100;
  return `<svg width="170" height="170" viewBox="0 0 170 170" aria-hidden="true"><circle cx="85" cy="85" r="${R}" fill="none" stroke="${P().track}" stroke-width="20"/>
    <circle class="seg" cx="85" cy="85" r="${R}" fill="none" stroke="${warnaC}" stroke-width="20" stroke-linecap="round" stroke-dasharray="${len} ${C-len}" transform="rotate(-90 85 85)" style="--c:${C}"/>
    <text x="85" y="96" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="800" fill="${P().ink}">${Math.round(persen)}%</text></svg>`;
}

}
function rK3Sebaran(d){

        <div class="ring">${cincin(cr, P().masuk)}<div class="t"><b class="num">${fmt(d.status.open)}</b><span>hazard masih terbuka<br>${fmt(d.status.close)} sudah ditutup</span></div></div></div>

function badge(s){ if (s === null) return '<span class="badge b-ok">Permanen</span>';
  if (s < 0) return `<span class="badge b-bad">Lewat ${fmt(-s)} hari</span>`;
  if (s <= 90) return `<span class="badge b-bad">${fmt(s)} hari lagi</span>`;
  if (s <= 180) return `<span class="badge b-warn">${fmt(s)} hari lagi</span>`;
  return `<span class="badge b-ok">${fmt(s)} hari lagi</span>`; }
function rEnvDok(d){
  const l = d.dokumen.map(o => Object.assign({}, o, {s: o.permanen ? null : sisaHari(o.kedaluwarsa)}))
    .sort((a,b) => (a.s===null?1e9:a.s) - (b.s===null?1e9:b.s)).slice(0,7);

    <div class="lgd"><span><i style="background:var(--coral)"></i>≤ 90 hari</span><span><i style="background:var(--amber)"></i>≤ 180 hari</span><span><i style="background:var(--green)"></i>Aman</span></div></div>
    <div class="dok">${l.map((o,i) => `<div class="dr rise" style="--i:${i*0.4}"><div><div class="j">${esc(o.nama)}</div><div class="o">${esc(o.tipe)}${o.pemilik?' · '+esc(o.pemilik):''}${o.lembaga?' · '+esc(o.lembaga):''}</div></div>
      <div class="tg">${o.s===null?'—':fmtTgl(o.kedaluwarsa)}</div>${badge(o.s)}</div>`).join('')}</div></div>`;
}

    <div class="row"><span>Belum dikerjakan</span><b class="num">${fmt(t.todo)}</b></div>
    <div class="row"><span>Sedang berjalan</span><b class="num">${fmt(t.proses)}</b></div>
    <div class="row"><span>Ada kendala</span><b class="num" style="${t.kendala?'color:var(--coral)':''}">${fmt(t.kendala)}</b></div></div>`;
}
const SIDE = {nursery:sideNursery, k3:sideK3, enviro:sideEnviro};

/* ================= STATE ================= */
const data = {nursery:null, k3:null, enviro:null}, stat = {nursery:'mati', k3:'mati', enviro:'mati'}, galat = {}, sig = {};
let vis = [], idx = 0, mulai = performance.now(), jeda = false, sisa = 0, appTampil = '';

function hitungVis(){
  vis = SCENES.filter(s => (!CONFIG.HANYA || CONFIG.HANYA === s.app) && data[s.app] && s.aktif(data[s.app]));
}
function countUp(n){ const to = +n.dataset.count||0, t0 = performance.now();
  (function f(t){ const k = Math.min(1,(t-t0)/1100), e = 1-Math.pow(1-k,3); n.textContent = fmt(Math.round(to*e)); if (k<1) requestAnimationFrame(f); })(t0); }

function rSide(app){
  $('#sideIsi').innerHTML = data[app] ? SIDE[app](data[app]) : '';
  $('#sideIsi').querySelectorAll('[data-count]').forEach(countUp);
}
function tampil(i, {tetap = false} = {}){
  if (!vis.length) return;
  idx = ((i % vis.length) + vis.length) % vis.length;
  const sc = vis[idx]; if (!tetap && sc.sebelum) sc.sebelum();
  const el = document.createElement('section'); el.className = 'scene'; el.innerHTML = sc.render(data[sc.app]);
  $('#scenes').replaceChildren(el);
  el.querySelectorAll('img[data-fb]').forEach(img => { const fb = img.nextElementSibling; img.addEventListener('error', () => { img.remove(); if (fb) fb.style.display = 'flex'; }); });
  el.querySelectorAll('[data-count]').forEach(countUp);
  if (sc.app !== appTampil || tetap) { appTampil = sc.app; rSide(sc.app); }
  const A = APPS.find(a => a.id === sc.app);
  $('#appJudul').textContent = A.judul;
  $('#judul').textContent = '· ' + sc.judul;
  $('#stage').style.setProperty('--app', P().app[sc.app]);
  document.querySelectorAll('.grp').forEach(g => g.classList.toggle('on', g.dataset.app === sc.app));
  document.querySelectorAll('.segs button').forEach(b => { const j = +b.dataset.i; b.classList.toggle('done', j < idx); b.setAttribute('aria-selected', j === idx); b.querySelector('em').style.width = j < idx ? '100%' : '0'; });
  if (!tetap) { mulai = performance.now(); sisa = 0; }
}
function bangunTabs(){
  const grup = APPS.map(a => ({a, s: vis.map((s,i) => ({s,i})).filter(o => o.s.app === a.id)})).filter(g => g.s.length);
  $('#tabs').innerHTML = grup.map(g => `<div class="grp" data-app="${g.a.id}" style="flex:${g.s.length}"><div class="nm"><i style="background:${P().app[g.a.id]}"></i>${esc(g.a.nama)}</div>
    <div class="segs">${g.s.map(o => `<button type="button" role="tab" data-i="${o.i}" aria-label="${esc(g.a.nama)}: ${esc(o.s.judul)}" title="${esc(o.s.judul)}"><b><em style="background:${P().app[g.a.id]}"></em></b></button>`).join('')}</div></div>`).join('');
  $('#tabs').querySelectorAll('.segs button').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); tampil(+b.dataset.i); }));
}
function rTicker(){
  const it = [], n = data.nursery, k = data.k3, v = data.enviro;
  if (k) { k.info.forEach(p => it.push(p.teks)); const st = k.safetyTalk[0]; if (st) it.push(`Safety talk ${fmtTgl(st.tanggal)}${st.waktu?' pukul '+st.waktu:''}${st.tempat?' di '+st.tempat:''}: ${st.topik}`); }
  if (v) { v.info.forEach(p => it.push(p.teks)); v.dokumen.forEach(o => { const s = o.permanen ? null : sisaHari(o.kedaluwarsa); if (s !== null && s <= 90) it.push(`${o.tipe} ${o.nama}${o.pemilik?' ('+o.pemilik+')':''} ${s<0?'sudah kedaluwarsa':'berakhir dalam '+s+' hari'}`); }); }
  if (n) { n.info.forEach(p => it.push(p.teks)); n.kegiatan.slice(0,2).forEach(x => it.push(`${x.kegiatan}${x.sub?' ('+x.sub+')':''}${x.total?': '+fmt(x.total)+' batang':''} · ${fmtTgl(x.tanggal)}`));
    if (n.stok.perJenis[0]) it.push(`Stok bibit terbanyak: ${n.stok.perJenis.slice(0,3).map(o => o.jenis+' '+fmt(o.stok)).join(' · ')}`); }
  it.push('Utamakan keselamatan, jaga lingkungan.');
  const run = $('#tkRun'); run.innerHTML = it.map(esc).join('<em>●</em>');
  run.style.animationDuration = Math.max(30, run.textContent.length*0.16) + 's';
}
function chip(){
  const ids = APPS.map(a => a.id).filter(a => (CONFIG.HANYA ? a === CONFIG.HANYA : true) && (CONFIG.DEMO || CONFIG.API[a]));
  const live = ids.filter(a => stat[a] === 'live').length, demo = ids.filter(a => stat[a] === 'demo').length, off = ids.filter(a => stat[a] === 'offline').length;
  const c = $('#chip'); let t, cls;
  if (demo) { cls = 'demo'; t = `Pratinjau · data contoh`; }
  else if (!live && !off) { cls = 'demo'; t = Object.values(galat).find(Boolean) || 'Menghubungkan…'; }
  else if (off) { cls = 'offline'; t = `${live}/${live+off} tersambung · sebagian offline`; }
  else { cls = 'live'; t = `${live} aplikasi tersambung · ${jamStr(new Date())}`; }
  c.className = cls; $('#chipTeks').textContent = t;
  c.title = Object.entries(galat).filter(([,v]) => v).map(([k,v]) => k + ': ' + v).join('\n');
}
function terapkan(app, d, st){
  d = NORMAL[app](d);
  const s = JSON.stringify(d, (k,v) => k === 'dibuat' ? undefined : v), berubah = s !== sig[app]; sig[app] = s;
  data[app] = d; stat[app] = st; chip();
  if (!berubah) return;
  const pertama = !vis.length, idLama = vis[idx] && vis[idx].id;
  hitungVis();
  const j = vis.findIndex(x => x.id === idLama); idx = j >= 0 ? j : 0;
  bangunTabs(); rTicker();
  if (pertama) tampil(0); else if (vis[idx] && vis[idx].app === app) tampil(idx, {tetap:true}); else tampil(idx, {tetap:true});
}

/* ================= AMBIL DATA ================= */
const CONTOH = {nursery:contohNursery, k3:contohK3, enviro:contohEnviro};
const CK = a => 'tv_cache_' + a;
function muatCache(a){ try { const c = JSON.parse(localStorage.getItem(CK(a))); return c && c.data ? c : null; } catch (e) { return null; } }
function simpanCache(a, d){ try { localStorage.setItem(CK(a), JSON.stringify({data:d, waktu:new Date().toISOString()})); } catch (e) {} }
async function ambilApp(a){
  if (CONFIG.HANYA && CONFIG.HANYA !== a) return;
  const url0 = CONFIG.API[a];
  if (CONFIG.DEMO) { galat[a] = 'mode contoh'; terapkan(a, CONTOH[a](), 'demo'); return; }
  if (!url0) return; // aplikasi ini belum disambungkan: dilewati
  const url = url0 + (url0.includes('?') ? '&' : '?') + 'tv=1' + (CONFIG.KUNCI ? '&k=' + encodeURIComponent(CONFIG.KUNCI) : '') + '&t=' + Date.now();
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), CONFIG.TIMEOUT*1000);
  try {
    const r = await fetch(url, {signal:ctl.signal, redirect:'follow'}); const teks = await r.text(); clearTimeout(to);
    let j; try { j = JSON.parse(teks); } catch (e) { throw new Error('Respons bukan JSON: kode TV belum terpasang atau deployment belum versi baru'); }
    if (!j.ok) throw new Error(j.error || 'Respons tidak valid');
    galat[a] = ''; simpanCache(a, j); terapkan(a, j, 'live');
  } catch (e) {
    clearTimeout(to); galat[a] = e.name === 'AbortError' ? 'Waktu tunggu habis' : (e.message || 'Gagal terhubung');
    if (data[a] && stat[a] !== 'demo') { stat[a] = 'offline'; chip(); return; }
    const c = muatCache(a); if (c) terapkan(a, c.data, 'offline'); else chip();
  }
}
const ambil = () => Promise.all(APPS.map(x => ambilApp(x.id)));

/* ================= KONTROL ================= */
function fit(){ const s = Math.min(innerWidth/1920, innerHeight/1080); $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3500); }
const IK = {
  matahari:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  bulan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  buka:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  tutup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>',
  jeda:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  putar:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>'
};
function segarkanTombol(){
  $('#bTema').innerHTML = tema === 'terang' ? IK.bulan+'Gelap' : IK.matahari+'Terang';
  const penuh = !!(document.fullscreenElement || document.webkitFullscreenElement);
  $('#bPenuh').innerHTML = penuh ? IK.tutup+'Normal' : IK.buka+'Penuh';
  $('#bJeda').innerHTML = jeda ? IK.putar+'Putar' : IK.jeda+'Jeda';
  $('#bJeda').classList.toggle('aktif', jeda);
}
function togelJeda(){ jeda = !jeda; document.body.classList.toggle('jeda', jeda); if (jeda) sisa = performance.now()-mulai; else mulai = performance.now()-sisa; segarkanTombol(); }
function layarPenuh(){
  const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen, exit = document.exitFullscreen || document.webkitExitFullscreen;
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) { exit.call(document); return; }
    if (!req) { toast('Browser TV ini tidak mendukung layar penuh'); return; }
    const r = req.call(el); if (r && r.catch) r.catch(() => toast('Layar penuh ditolak browser. Coba sekali lagi.'));
  } catch (e) { toast('Layar penuh tidak tersedia di browser ini'); }
}
function terapkanTema(){ document.body.classList.toggle('gelap', tema === 'gelap'); }
function gantiTema(){
  tema = tema === 'terang' ? 'gelap' : 'terang';
  try { localStorage.setItem(TK, tema); } catch (e) {}
  terapkanTema(); segarkanTombol();
  if (vis.length) { bangunTabs(); tampil(idx, {tetap:true}); }
  toast(tema === 'gelap' ? 'Tema gelap' : 'Tema terang');
}
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return; const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === 'n') tampil(idx+1);
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'p') tampil(idx-1);
  else if (k === ' ') { e.preventDefault(); togelJeda(); }
  else if (k === 'f' || k === 'F') layarPenuh();
  else if (k === 't' || k === 'T') gantiTema();
  else if (k === 'r' || k === 'R') { toast('Menyegarkan data…'); ambil(); }
  else if (/^[1-9]$/.test(k) && vis[+k-1]) tampil(+k-1);
});
$('#stage').addEventListener('click', e => {
  if (e.target.closest('#tabs') || e.target.closest('#ctl')) return;
  const r = $('#stage').getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  if (x < 0.3) tampil(idx-1); else if (x > 0.7) tampil(idx+1); else togelJeda();
});
let sepiT; const bangun = () => { document.body.classList.remove('sepi'); clearTimeout(sepiT); sepiT = setTimeout(() => document.body.classList.add('sepi'), 3000); };
addEventListener('mousemove', bangun); addEventListener('touchstart', bangun, {passive:true}); bangun();
addEventListener('resize', fit); addEventListener('online', ambil);
function detak(){ const n = new Date();
  $('#jam').textContent = n.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', timeZone:TZ});
  $('#tgl').textContent = n.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:TZ}); }
setInterval(detak, 1000); detak();
setInterval(() => { if (!vis.length) return; const lewat = jeda ? sisa : performance.now()-mulai;
  const em = document.querySelector(`.segs button[data-i="${idx}"] em`); if (em) em.style.width = Math.min(100, lewat/(CONFIG.DURASI*10)) + '%';
  if (!jeda && lewat >= CONFIG.DURASI*1000) tampil(idx+1); }, 100);

$('#bPrev').addEventListener('click', () => tampil(idx-1));
$('#bNext').addEventListener('click', () => tampil(idx+1));
$('#bJeda').addEventListener('click', togelJeda);
$('#bTema').addEventListener('click', gantiTema);
$('#bPenuh').addEventListener('click', layarPenuh);
document.addEventListener('fullscreenchange', segarkanTombol);
document.addEventListener('webkitfullscreenchange', segarkanTombol);
terapkanTema(); segarkanTombol();
fit(); ambil(); setInterval(ambil, CONFIG.REFRESH*1000);
})();
</script>
</body>
</html>
